<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Metadatos principales -->
    <meta charset="UTF-8"> <!-- Codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajuste responsivo en dispositivos móviles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Acceso - Diario Quest</title> <!-- Título que aparece en la pestaña del navegador -->
    <link rel="stylesheet" href="login.css"> <!-- Enlace al archivo de estilos CSS para la página de login -->
</head>

<body class="login-page">
    <!-- Clase para aplicar estilos específicos de la página de login -->
    <div class="login-container">
        <div class="login-header">
            <div class="logo">♡Diario Quest</div>
            <button id="darkModeToggle" class="icon-btn"><i class="fas fa-moon"></i></button>
        </div>
        <!-- Contenedor central del formulario de acceso -->
        <!-- Encabezado de bienvenida -->
        <h1>¡Bienvenido/a de Nuevo!</h1>
        <p class="subtitle">Inicia sesión para continuar tu aventura o únete a nosotros.</p>

        <div id="messageContainer" class="message-container"></div> <!-- Para mostrar mensajes de error/éxito -->
        <!-- Formulario de inicio de sesión -->
        <form class="login-form">
            <!-- Clase usada en JS para manejar el evento submit -->
            <label for="email">Correo electrónico</label> <!-- Etiqueta asociada al campo de email -->
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required> <!-- Input para email, obligatorio -->

            <label for="password">Contraseña</label> <!-- Etiqueta asociada al campo de contraseña -->
            <input type="password" id="password" placeholder="••••••••" required> <!-- Input para contraseña, obligatorio -->

            <!-- Botón de envío del formulario -->
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>

        <!-- Opciones alternativas: registro e invitado -->
        <div class="alt-options">
            <p>¿No tienes cuenta? <a href="register.html" id="createAccountLink">Crear una</a></p> <!-- Enlace para registro de nuevos usuarios -->
            <!-- Botón para entrar como invitado, manejado en JS -->
            <button type="button" class="btn guest" id="guestLoginBtn">Continuar como invitado</button>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
