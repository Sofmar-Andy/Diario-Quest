<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Registro - Diario Quest</title>
    <link rel="stylesheet" href="login.css"> <!-- Reutilizaremos los estilos de login.css por simplicidad -->
    <style>
        /* Pequeños ajustes específicos para register.html si son necesarios */
        .login-container h1 {
            font-size: 1.8rem; /* Un poco más pequeño para "Crear Cuenta" */
        }
    </style>
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">♡Diario Quest</div>
            <button id="darkModeToggle" class="icon-btn"><i class="fas fa-moon"></i></button>
        </div>
        <h1>Crea tu Cuenta</h1>
        <p class="subtitle">¡Únete a la aventura y empieza a conquistar tus metas!</p>

        <div id="messageContainer" class="message-container"></div>

        <form id="registerForm" class="login-form">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" placeholder="Elige un nombre de aventurero" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>

            <label for="confirmPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>

            <button type="submit" class="btn">Registrarme</button>
        </form>

        <div class="alt-options">
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a></p>
        </div>
    </div>
    <script src="register.js"></script>
</body>

</html>
