<!DOCTYPE html>
<html lang="es">
<!-- Inicio del documento HTML para la página de Metas -->
<head>
    <!-- Metadatos: charset y viewport responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Título de la pestaña y enlace a estilos específicos -->
    <title>Mis Metas - Diario Quest</title>
    <link rel="stylesheet" href="metas.css"> <!-- Enlace al CSS específico de esta página -->
</head>

<body>
    <!-- Encabezado con logo, navegación y controles -->
    <header class="site-header">
        <div class="logo">♡Diario Quest</div> <!-- Nombre del sitio con ícono -->
        <nav class="nav"> <!-- Navegación principal -->
            <a href="index.html">Inicio</a>
            <a href="metas.html" class="active">Metas</a> <!-- Enlace activo para la página actual -->
            <a href="logros.html">Logros</a>
            <a href="diario.html">Diario</a>
            <a href="perfil.html">Perfil</a>
        </nav>
        <!-- Botón para alternar entre modo claro y oscuro -->
        <button id="darkModeToggle" class="btn icon-btn">🌙</button>
    </header>

    <main class="page-content">
        <!-- Sección del cuestionario inicial. Se oculta después de completarlo. -->
        <section id="initialSurveySection" class="survey-container">
            <h1>¡Bienvenido/a a tus Metas!</h1>
            <p>Responde unas pocas preguntas para que podamos sugerirte algunas metas iniciales.</p>
            <form id="surveyForm">
                <div class="field">
                    <label for="ageRange">¿Cuál es tu rango de edad?</label>
                    <select id="ageRange" name="ageRange" required>
                        <option value="" disabled selected>Selecciona...</option> <!-- Opción por defecto, deshabilitada -->
                        <option value="estudiante">Estudiante (hasta 22 años)</option>
                        <option value="adulto_joven">Adulto Joven (23-35 años)</option>
                        <option value="adulto">Adulto (36-55 años)</option>
                        <option value="senior">Senior (56+ años)</option>
                    </select>
                </div>
                <div class="field">
                    <label for="interest">¿Cuál es tu principal área de interés para superación personal?</label>
                    <select id="interest" name="interest" required>
                        <option value="" disabled selected>Selecciona...</option> <!-- Opción por defecto, deshabilitada -->
                        <option value="salud">Salud y Bienestar (Ejercicio, Nutrición, Mindfulness)</option>
                        <option value="aprendizaje">Aprendizaje y Desarrollo (Habilidades, Conocimiento)</option>
                        <option value="creatividad">Creatividad y Hobbies (Arte, Música, Escritura)</option>
                        <option value="productividad">Productividad y Organización (Gestión del tiempo, Hábitos)</option>
                        <option value="social">Relaciones y Social (Comunicación, Conexiones)</option>
                    </select>
                </div>
                <!-- Botón para enviar el cuestionario y generar metas -->
                <button type="submit" class="btn btn-primary">Generar Metas Sugeridas</button>
            </form>
        </section>

        <!-- Sección para mostrar las metas del usuario. Inicialmente oculta si el cuestionario no se ha completado. -->
        <section id="goalsDisplaySection" class="hidden">
            <div class="goals-header">
                <h1>Mis Metas</h1>
                <!-- Muestra el total de XP acumulado por el usuario -->
                <div class="xp-display">XP Total: <span id="totalUserXP">0</span></div>
            </div>
            <p>Aquí puedes ver tus metas actuales. ¡Completa metas para ganar XP y desbloquear logros!</p>
            <!-- Botón para abrir el modal y añadir una nueva meta personalizada -->
            <button id="openAddGoalModalBtn" class="btn btn-primary">Añadir Nueva Meta Personalizada</button>
            <!-- Contenedor donde se insertarán dinámicamente las tarjetas de metas mediante JavaScript -->
            <div id="goalsList" class="goals-cards-container">
                <!-- Las tarjetas de metas se insertarán aquí por JS -->
            </div>
        </section>
    </main>

    <!-- Modal para Añadir (y futuramente Editar) Metas. Oculto por defecto. -->
    <div id="goalModal" class="modal">
        <div class="modal-content">
            <!-- Botón para cerrar el modal -->
            <span class="close-button" id="closeGoalModalBtn">&times;</span>
            <h2 id="goalModalTitle">Añadir Nueva Meta</h2>
            <!-- Formulario para crear una nueva meta -->
            <form id="goalForm">
                <input type="hidden" id="goalId"> <!-- Campo oculto para el ID de la meta (usado en edición) -->
                <div class="field">
                    <label for="goalTitle">Título de la Meta:</label>
                    <input type="text" id="goalTitle" required> <!-- Campo obligatorio -->
                </div>
                <div class="field">
                    <label for="goalDescription">Descripción (opcional):</label>
                    <textarea id="goalDescription"></textarea>
                </div>
                <div class="field">
                    <!-- XP que se otorgará al completar esta meta -->
                    <label for="goalXP">XP al completar:</label>
                    <input type="number" id="goalXP" value="20" min="5" required> <!-- Valor por defecto 20, mínimo 5 -->
                </div>
                <div class="field">
                    <label for="goalDueDate">Fecha Límite (opcional):</label>
                    <input type="date" id="goalDueDate">
                </div>
                <button type="submit" class="btn btn-primary">Guardar Meta</button>
            </form>
        </div>
    </main>

    <!-- Enlace al archivo JavaScript que maneja la lógica de esta página de metas -->
    <script src="metas.js"></script>
</body>

</html>
